[workspace]
exclude = ["crates/horizon-telemetry-server", "crates/horizon-mod-registry"]
members = [
    "crates/horizon-addresses",
    "crates/horizon-core",
    "crates/horizon-threads",
    "crates/horizon-world",
    "crates/horizon-command",
    "crates/horizon-items",
    "crates/horizon-server-files",
    "crates/horizon-anticheat",
    "crates/horizon-chat-filter",
    # The Model Context Protocol, shared by horizon-ctl and horizon-server.
    "crates/horizon-mcp",
    "crates/horizon-server",
    "crates/horizon-protocol",
    "crates/horizon-system",
    "crates/horizon-platform",
    "crates/horizon-hooks",
    "crates/horizon-game",
    "crates/horizon-heartbeat",
    "crates/horizon-discord",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
